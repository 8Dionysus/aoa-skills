policy:
  allow_implicit_invocation: false
  implicit_activation_policy: suggest
notes:
- Select exactly one contract, coverage-audit, or property mode.
- Manual evidence is primary; durable automation follows only a stable repeated invariant.
interface:
  display_name: AoA Verification
  short_description: Turn one stable truth into bounded evidence
  default_prompt: Use $aoa-verification to choose one contract, coverage-audit, or property mode, starting from manual evidence and a stable owner invariant.
  icon_small: ./assets/small-logo.svg
  icon_large: ./assets/large-logo.svg
  brand_color: '#2563EB'
