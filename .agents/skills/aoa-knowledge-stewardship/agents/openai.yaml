policy:
  allow_implicit_invocation: false
  implicit_activation_policy: suggest
notes:
- Select exactly one authority-map, sanitized-share, or memo-route mode.
- Never collapse candidate routing, artifact creation, publication, and durable memory into one effect.
interface:
  display_name: AoA Knowledge Stewardship
  short_description: Steward authority, sanitization, or memo routing
  default_prompt: Use $aoa-knowledge-stewardship to choose one authority-map, sanitized-share, or memo-route mode while preserving custody and owner authority.
  icon_small: ./assets/small-logo.svg
  icon_large: ./assets/large-logo.svg
  brand_color: '#2563EB'
