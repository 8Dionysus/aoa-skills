  short_description: Correct decision records
  default_prompt: Use $aoa-decision-correct to repair the source decision note first, rebuild local indexes, and refresh the workspace graph.
  icon_small: ./assets/small-logo.svg
  icon_large: ./assets/large-logo.svg
  brand_color: '#2563EB'
policy:
  implicit_activation_policy: manual
  allow_implicit_invocation: false
dependencies:
  tools:
  - type: mcp
    value: aoa_decisions
    description: AoA workspace decision graph MCP server
    transport: stdio
