interface:
  display_name: AoA Decision Find
  short_description: Find decision records
  default_prompt: Use $aoa-decision-find to search the decision graph, read the matching source notes, and return compact decision context.
  icon_small: ./assets/small-logo.svg
  icon_large: ./assets/large-logo.svg
  brand_color: '#2563EB'
policy:
  implicit_activation_policy: manual
  allow_implicit_invocation: false
dependencies:
  tools:
  - type: mcp
    value: aoa_decisions
    description: AoA workspace decision graph MCP server
    transport: stdio
