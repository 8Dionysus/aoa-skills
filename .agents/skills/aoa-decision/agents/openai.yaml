policy:
  allow_implicit_invocation: true
  implicit_activation_policy: invoke
notes:
- This family may be invoked implicitly for clear decision-lane work.
- Select exactly one internal find, record, or correct mode. Legacy child names are migration aliases and must not be loaded after mode selection.
interface:
  display_name: AoA Decision
  short_description: Find, record, or correct durable decisions
  default_prompt: Use $aoa-decision to choose exactly one find, record, or correct mode while keeping owner-authored decision records authoritative.
  icon_small: ./assets/small-logo.svg
  icon_large: ./assets/large-logo.svg
  brand_color: '#2563EB'
