policy:
  allow_implicit_invocation: false
  implicit_activation_policy: suggest
notes:
- An implicit match may suggest this deferred family, but execution requires explicit invocation or a source-authorized parent route.
- Select exactly one internal select, apply, or propose mode; do not load legacy eval children.
interface:
  display_name: AoA Eval
  short_description: Select, apply, or propose bounded evaluation
  default_prompt: Use $aoa-eval to choose exactly one select, apply, or propose mode and state the proof limit of the resulting evidence.
  icon_small: ./assets/small-logo.svg
  icon_large: ./assets/large-logo.svg
  brand_color: '#2563EB'
