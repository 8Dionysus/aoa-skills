schema_version: 1
source_fixtures: tests/fixtures/skill_evaluation_cases.yaml
purpose: >
  Compact deterministic route pack for agentic-OS skill selection, handoff,
  approval, and guardrail posture. This is not a broad model eval dataset.
coverage:
  per_skill_snapshot_cases: require_one_use_and_one_do_not_use_per_skill
  high_risk_adjacency_cases:
    - approval_gate_vs_preview_and_infra_boundary
    - approval_gate_vs_safe_infra_boundary
    - approval_gate_vs_sanitized_share_boundary
    - dry_run_first_vs_approval_gate_boundary
    - dry_run_first_vs_safe_infra_boundary
    - dry_run_first_vs_sanitized_share_boundary
    - safe_infra_change_vs_approval_gate_boundary
    - safe_infra_change_vs_dry_run_first_boundary
    - safe_infra_change_vs_sanitized_share_boundary
    - sanitized_share_vs_approval_gate_boundary
    - sanitized_share_vs_dry_run_first_boundary
    - sanitized_share_vs_safe_infra_change_boundary
    - summon_vs_route_forks_boundary
    - checkpoint_closeout_bridge_vs_donor_harvest_boundary
    - session_route_forks_vs_automation_scan_boundary
    - session_self_repair_vs_self_diagnose_boundary
trace_contracts:
  - id: approval_sensitive_action_requires_approval_route
    source_case_id: approval_gate_sensitive_action
    expected_skill: aoa-approval-gate-check
    route_family: approval
    expected_terms:
      - approval
      - sensitive
  - id: dry_run_preview_stays_previewable
    source_case_id: dry_run_first_previewable_operation
    expected_skill: aoa-dry-run-first
    route_family: tool-boundary
    expected_terms:
      - dry-run
      - preview
  - id: safe_infra_keeps_authority_boundary
    source_case_id: safe_infra_change_bounded_operational_change
    expected_skill: aoa-safe-infra-change
    route_family: permission
    expected_terms:
      - scope
      - rollback
  - id: sanitized_share_blocks_sensitive_leakage
    source_case_id: sanitized_share_sensitive_material
    expected_skill: aoa-sanitized-share
    route_family: data-boundary
    expected_terms:
      - sensitive
      - sanitized
  - id: summon_requires_anchored_handoff
    source_case_id: summon_anchored_local_child_review
    expected_skill: aoa-summon
    route_family: handoff
    expected_terms:
      - child
      - review
  - id: session_repair_requires_diagnosis_packet
    source_case_id: session_self_repair_reviewed_diagnosis_packet
    expected_skill: aoa-session-self-repair
    route_family: recovery
    expected_terms:
      - diagnosis
      - repair
  - id: titan_mutation_stays_explicit
    source_case_id: titan_mutation_gate_explicit_titan_route
    expected_skill: titan-mutation-gate
    route_family: approval
    expected_terms:
      - titan
      - mutation
