trigger_cases:
  - skill: aoa-adr-write
    case_id: adr_write_meaningful_decision
    prompt: Record a decision that changes workflow structure and has multiple plausible options, so future contributors need the rationale.
    expected: use
    required_phrases:
      - a decision changes structure, boundaries, tooling, or workflow expectations
      - future contributors will need to know why a path was chosen
  - skill: aoa-adr-write
    case_id: adr_write_tiny_obvious_change
    prompt: Add a short note for a tiny self-evident edit where the diff already explains everything.
    expected: do_not_use
    required_phrases:
      - the change is tiny and self-evident
      - the note would only restate an obvious diff with no real decision content
  - skill: aoa-adr-write
    case_id: adr_write_no_decision_yet
    prompt: Explore possible ADR options before the team has chosen a path.
    expected: do_not_use
    required_phrases:
      - no decision exists yet
      - the next step is still discovery, option framing, or owner-route clarification
  - skill: aoa-adr-write
    case_id: adr_write_cross_boundary_decision
    prompt: Record a reviewed decision that changes a repo workflow after generated audit evidence and closeout review showed the current placement no longer works.
    expected: use
    required_phrases:
      - the decision crosses ownership, layer, evidence, lifecycle, portability, runtime-facing, handoff, risk, or scale boundaries and needs a durable rationale
      - reviewed evidence, planning work, generated output, audit results, or operational receipts have revealed a decision that must stay separate from the evidence that revealed it
  - skill: aoa-adr-write
    case_id: adr_write_unresolved_boundary_first
    prompt: Write an ADR while we still do not know whether the decision belongs to this repo, a sibling repo, or a generated surface.
    expected: do_not_use
    required_phrases:
      - the boundary itself is still ambiguous
      - use `aoa-bounded-context-map` before recording the decision
  - skill: aoa-adr-write
    case_id: adr_write_unreviewed_checkpoint_hint
    prompt: Turn every provisional hint, planning idea, and generated observation from the session into ADRs even though no reviewed decision was made.
    expected: do_not_use
    required_phrases:
      - the request is to record every possible lens, provisional hint, planning idea, or generated observation without one reviewed decision to preserve
  - skill: aoa-adr-write
    case_id: adr_write_ordinary_implementation_choice
    prompt: Write an ADR for choosing a small helper implementation where the rationale is already clear from the diff, tests, and review summary.
    expected: do_not_use
    required_phrases:
      - the decision is an ordinary implementation choice whose rationale is already clear from the diff, tests, commit message, or review summary
  - skill: aoa-adr-write
    case_id: adr_write_runbook_or_incident_followup
    prompt: Write an ADR for a runtime incident follow-up where the next honest move is an operational runbook update and risk approval.
    expected: do_not_use
    required_phrases:
      - the next honest move is a runbook, incident note, risk approval, or operational follow-up rather than durable decision rationale

  - skill: aoa-decision
    case_id: decision_router_docs_decisions_graph
    prompt: Use the decisions graph to decide whether this docs/decisions task is a lookup, a new record, or a correction.
    expected: use
    required_phrases:
      - the task mentions `docs/decisions/`, decision records, ADRs, decision indexes, decision graph, or decision-lane symmetry
      - the work spans more than one AoA repository and graph lookup can reduce context load
  - skill: aoa-decision
    case_id: decision_router_plain_docs_edit
    prompt: Update a README paragraph that has no decision-lane or durable rationale impact.
    expected: do_not_use
    required_phrases:
      - the task is a normal docs edit with no durable decision-lane implication
      - the request is only to summarize code, tests, or release notes without decision rationale
  - skill: aoa-decision-find
    case_id: decision_find_prior_rationale
    prompt: Find which existing AoA decision explains a boundary before editing the related source surface.
    expected: use
    required_phrases:
      - the user asks what decision exists, which record explains a route, or why a boundary was chosen
      - graph search can prevent broad manual reads across many decision lanes
  - skill: aoa-decision-find
    case_id: decision_find_create_needed
    prompt: Write a new decision record for a chosen MCP access-plane change.
    expected: do_not_use
    required_phrases:
      - a new decision note must be written; use `aoa-decision-create`
      - an existing note or metadata must be edited; use `aoa-decision-correct`
  - skill: aoa-decision-create
    case_id: decision_create_structural_rationale
    prompt: Create a durable decision note for a structural source/export boundary that changed after review.
    expected: use
    required_phrases:
      - a change creates durable rationale that future agents need before repeating the route
      - graph lookup should identify similar prior decisions, next ID, source surfaces, or symmetry constraints
  - skill: aoa-decision-create
    case_id: decision_create_existing_note_correction
    prompt: Fix the source-surface list in an existing decision record.
    expected: do_not_use
    required_phrases:
      - an existing record can be corrected instead; use `aoa-decision-correct`
      - no decision has been made yet and the work is still option framing
  - skill: aoa-decision-correct
    case_id: decision_correct_stale_metadata
    prompt: Correct stale index metadata and regenerate the decision indexes for an existing record.
    expected: use
    required_phrases:
      - a decision record is stale, incomplete, misindexed, wrongly sourced, or needs supersession
      - generated decision indexes are out of date with source metadata
  - skill: aoa-decision-correct
    case_id: decision_correct_new_record_needed
    prompt: Create a new decision record for a chosen skill-chain route.
    expected: do_not_use
    required_phrases:
      - the task is only to find relevant rationale; use `aoa-decision-find`
      - a new durable decision is required instead; use `aoa-decision-create`

  - skill: aoa-eval
    case_id: eval_router_existing_or_missing_eval_route
    prompt: Decide whether this repository change should use an existing eval, run a validator, create local eval intake, or mine sessions for missed eval triggers.
    expected: use
    required_phrases:
      - the user asks whether an eval exists
      - a route must separate proof authority
  - skill: aoa-eval
    case_id: eval_router_plain_unit_test
    prompt: Add one ordinary unit test for a local helper where there is no eval routing, proof, regression, or local eval-port question.
    expected: do_not_use
    required_phrases:
      - the task is only to add an ordinary unit test with no eval routing question
  - skill: aoa-eval
    case_id: eval_router_drifted_contract_lane
    prompt: A contract lane looks drifted or agent-written and touches proof behavior; before editing it, decide whether existing evals, validators, tests, scripts, or local eval intake apply.
    expected: use
    required_phrases:
      - a repeated failure, validation gap, proof gap, regression, trigger miss
      - a route must separate proof authority
  - skill: aoa-eval
    case_id: eval_router_workspace_inventory_route
    prompt: Use the OS Abyss local eval-port inventory to decide what to do with repositories marked missing, skeleton, active, and invalid before writing any new eval material.
    expected: use
    required_phrases:
      - repo-family or workspace-local eval-port inventory
      - missing/skeleton/active/invalid port status
  - skill: aoa-eval
    case_id: eval_router_session_front_door
    prompt: Start a new OS Abyss eval session and decide which local or central eval tools to bring up before touching repo files.
    expected: use
    required_phrases:
      - OS Abyss eval session needs a current readiness packet
      - eval_forge_front_door
      - EVAL_FORGE_OPERATING_PATH.md
      - before selecting
  - skill: aoa-eval
    case_id: eval_router_route_sign_without_eval_keyword
    prompt: A repo task shows repeated owner-boundary confusion; the agent skipped existing validators and tests, treated a generated readiness packet as proof, and needs a route that separates central proof, local intake, MCP access, and session evidence before continuing.
    expected: use
    required_phrases:
      - route signs can trigger this skill even when the user never says `eval`
      - a repeated failure, validation gap, proof gap, regression, trigger miss
      - a route must separate proof authority
  - skill: aoa-eval
    case_id: eval_router_keyword_only_noise
    prompt: eval test landing done, maybe check
    expected: do_not_use
    required_phrases:
      - keywords alone such as `eval`, `test`, `landing`, or `done` are not sufficient without route pressure
  - skill: aoa-eval
    case_id: eval_router_active_vs_stale_cleanup_boundary
    prompt: An old generated contract surface appears obsolete, but a newer active lane may own the proof truth; before deleting anything, inspect eval-port evidence, validators, tests, and scripts.
    expected: use
    required_phrases:
      - a repeated failure, validation gap, proof gap, regression, trigger miss
      - a route must separate proof authority
  - skill: aoa-eval
    case_id: eval_router_source_authority_only
    prompt: Find which source document owns a wording conflict before a normal docs edit; no eval coverage, regression, proof gap, or local eval-port question is present.
    expected: do_not_use
    required_phrases:
      - the task is only to find source authority
  - skill: aoa-eval-select
    case_id: eval_select_existing_surface
    prompt: Inspect the repo-local eval port, tests, validators, and central aoa-evals surfaces before deciding whether a new eval is needed.
    expected: use
    required_phrases:
      - a task asks which eval should be used for a change, failure, or regression
      - central `aoa-evals` may already contain the relevant proof pattern or local
  - skill: aoa-eval-select
    case_id: eval_select_apply_already_chosen
    prompt: The exact validation command is already selected and only needs to be run and reported.
    expected: do_not_use
    required_phrases:
      - an already selected eval simply needs to be run; use `aoa-eval-apply`
  - skill: aoa-eval-apply
    case_id: eval_apply_selected_validator
    prompt: Run the already selected local validator for an eval regression and report what it proves and what remains unproven.
    expected: use
    required_phrases:
      - an existing eval, validator, test, or script has already been selected
  - skill: aoa-eval-apply
    case_id: eval_apply_no_selection_yet
    prompt: We have not inspected the local eval port or central eval bundles yet, but need to know which proof surface might apply.
    expected: do_not_use
