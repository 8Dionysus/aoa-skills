  - id: skill.aoa-session-recovery
    title: aoa-session-recovery family bundle
    description: Diagnose a reviewed recurring session/workflow failure, or carry one bounded owner repair through checkpoint, rollback, and real health verification. Use for reviewed contamination, drift, repeated route/tool failure, or an established diagnosis ready for repair. Do not use on live evidence, for vague self-improvement, or to call a proposed or merely executed change verified.
    kind: skill
    contract_level: executable
    primary_parent: sessions.recovery
    owner: *session_owner
    lifecycle:
      state: candidate
      version: 0.2.2
      visibility: advertised
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - Reviewed evidence shows repeated contamination, routing drift, tool failure, false confidence, or an established diagnosis is ready for one bounded repair cycle.
      do_not_use_when:
        - Evidence is live or unreviewed, repair lacks a diagnosis or owner, or the route would bypass authorization, checkpoint, rollback, or health verification.
      ambiguous_when:
        - A single symptom may be environmental rather than a recurring session or workflow failure.
    abi:
      inputs:
        - name: recovery-request
          type: session-recovery-request
          required: true
          description: Reviewed evidence or diagnosis, target and durable owners, constraints, execution request, authorization, bindings, checkpoint, rollback, and health surfaces.
      outputs:
        - name: recovery-result
          type: session-recovery-result
          required: true
          description: Session diagnosis or repair-cycle result with evidence refs, execution posture, actual effects, health proof, uncertainty, and stop line.
    binding:
      kind: skill
      ref: skills/core/session-growth/aoa-session-recovery/SKILL.md
      operation: route-one-mode
      availability: available
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Read access to reviewed evidence, owner contracts, and health surfaces.
        - Mutation access only for an explicitly authorized repair through an available owner binding.
      verification:
        - Trace diagnosis and repair decisions to reviewed refs and keep symptoms, causes, intended actions, actual effects, and health proof distinct.
        - Compare pre/post health on the affected surface and confirm rollback and cleanup posture.
      termination:
        - Stop after one diagnosis or one bounded repair cycle at the strongest actually evidenced posture.
        - Stop as blocked when evidence, diagnosis, authorization, binding, checkpoint, rollback, or health proof required for the requested posture is unavailable.
      effects:
        - none
        - repo-write
        - runtime-mutation
      reversibility: conditionally-reversible
      failure_modes:
        - Self-confirming diagnosis or assigning settled blame from one symptom.
        - Treating a repair packet or executed action as verified repair.
        - Mutating without authorization, checkpoint, rollback, health checks, or bounded attempts.
        - Hiding a failed health check instead of rolling back or blocking.
    trust: *session_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-session-recovery/SKILL.md
          ref: capability-family-v0.2.2
          role: portable-family-procedure
          authority: authored
      optional_refs: []
    keywords:
      - session-diagnose
      - repair-proposal
      - repair-execution-posture
      - rollback
      - manual-health-check
      - диагноз-сессии
      - предложение-ремонта
      - откат
      - ручная-проверка

  - id: mode.session-recovery.diagnose
    title: Diagnose recurring session failure
    description: Separate observed symptoms, confirmed causes, inference, unknowns, drift class, and immediate versus durable owner.
    kind: mode
    contract_level: executable
    primary_parent: sessions.recovery
    owner: *session_owner
    lifecycle: *session_mode_lifecycle
    applicability:
      use_when:
        - Symptoms are reviewed but causes and target owner have not yet been established.
      do_not_use_when:
        - A reviewed diagnosis already exists and only a repair proposal or execution is requested.
      ambiguous_when:
        - Evidence supports correlation but not causality across tool, route, lifecycle, and environment failures.
    abi:
      inputs:
        - name: reviewed-failure-evidence
          type: reviewed-failure-evidence
          required: true
          description: Bounded reviewed symptoms, refs, constraints, and any disconfirming observations.
      outputs:
        - name: session-diagnosis
          type: session-diagnosis
          required: true
          description: Symptoms, causes, inference, unknowns, drift class, owner hints, and non-mutating repair shape.
    binding:
      kind: mode
      ref: skills/core/session-growth/aoa-session-recovery/references/diagnose.md
      operation: diagnose
      availability: available
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Read access only to reviewed evidence and relevant owner contracts.
      verification:
        - Trace every symptom and cause posture to reviewed refs and seek disconfirming evidence.
        - Confirm no owner, runtime, session archive, or provider was mutated.
      termination:
        - Stop after one diagnosis and explicit repair handoff or blocked state.
      effects: [none]
      reversibility: not-applicable
      failure_modes:
        - Treating one symptom, stale hint, or generated summary as settled cause.
        - Hiding unknowns or collapsing the immediate surface into the durable owner.
    trust: *session_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-session-recovery/references/diagnose.md
          ref: capability-family-v0.2.1
          role: diagnose-mode
          authority: authored
      optional_refs: []
    aliases:
