  - id: mode.session-recovery.repair
    title: Carry one bounded owner repair cycle
    description: Prepare or execute the smallest authorized owner repair with checkpoint, truthful execution posture, rollback, real health verification, cleanup, and escalation.
    kind: mode
    contract_level: executable
    primary_parent: sessions.recovery
    owner: *session_owner
    lifecycle: *session_mode_lifecycle
    applicability:
      use_when:
        - A reviewed diagnosis exists and one owner target needs a bounded repair prepared, executed, verified, rolled back, blocked, or handed off.
      do_not_use_when:
        - Diagnosis or target owner is absent, or mutation would bypass authorization, checkpoint, rollback, binding, or health contract.
      ambiguous_when:
        - A temporary session workaround may be enough and should not become durable owner policy.
    abi:
      inputs:
        - name: session-diagnosis
          type: reviewed-session-diagnosis
          required: true
          description: Reviewed diagnosis plus target owner, constraints, and current checkpoint or rollback posture.
      outputs:
        - name: repair-cycle-result
          type: repair-cycle-result
          required: true
          description: Smallest diff, authorization, checkpoint, rollback, execution posture, actions versus actual effects, health evidence, cleanup, stop, and handoff.
    binding:
      kind: mode
      ref: skills/core/session-growth/aoa-session-recovery/references/repair.md
      operation: repair
      availability: available
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Read access to the reviewed diagnosis, owner contracts, rollback anchors, and health surfaces.
        - An explicitly authorized and available owner binding for any state change.
      verification:
        - Capture pre-state and compare affected post-state behavior against the declared health contract.
        - Record actual effects and verify rollback restoration when rollback is triggered.
      termination:
        - Stop after one bounded repair cycle at proposed, prepared, executed, verified, rolled_back, blocked, or handoff_required.
      effects: [none, repo-write, runtime-mutation]
      reversibility: conditionally-reversible
      failure_modes:
        - Manufacturing a diagnosis or widening across owners.
        - Calling a prepared or executed change verified without health evidence.
        - Retrying without a limit or failing to rollback after a failed health check.
    trust: *session_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-session-recovery/references/repair.md
          ref: capability-family-v0.2.1
          role: repair-mode
          authority: authored
      optional_refs: []
    aliases:
      - name: aoa-session-self-repair
        state: migration-only
        remove_after: session-recovery-runtime-parity
    keywords:
