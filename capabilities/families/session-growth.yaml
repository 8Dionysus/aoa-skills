      do_not_use_when:
        - One route is already accepted or the request is to launch, delegate, schedule, or mutate.
      ambiguous_when:
        - Differences may only be implementation variants of the same owner route.
    abi:
      inputs:
        - name: continuation-pressure
          type: reviewed-continuation-pressure
          required: true
          description: Reviewed context, candidate routes, owner constraints, gains, risks, effects, and prerequisites.
      outputs:
        - name: continuation-branches
          type: continuation-branch-cards
          required: true
