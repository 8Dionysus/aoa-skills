    owner: *session_owner
    lifecycle:
      state: candidate
      version: 0.2.1
      visibility: internal
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - Reviewed evidence shows a recurring manual route whose automation readiness and first owner artifact are unresolved.
      do_not_use_when:
        - The work occurred once, remains exploratory or creative, needs source clarification first, or the request is live scheduling or mutation.
      ambiguous_when:
        - Repetition exists but stable triggers, inputs, outputs, rollback, or approval posture are not yet known.
    abi:
      inputs:
        - name: reviewed-repeated-manual-route
