          type: quest-promotion-verdict
          required: true
          description: Promotion/hold verdict, owner, reason, nearest wrong target, boundary, and proposed next artifact.
    binding:
      kind: mode
      ref: skills/core/session-growth/aoa-session-harvest/references/promote.md
      operation: promote
      availability: available
    execution: *harvest_execution
    trust: *session_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-session-harvest/references/promote.md
