schema_version: aoa-capability-family-v1
family_id: session-learning
title: Session evidence learning
description: Preserve reviewed-session harvesting, promotion, branching, automation triage, memo writeback, and recovery without moving owner truth into sessions.
owner:
  repo: aoa-skills
  surface: capabilities/families/session-growth.yaml
  authority: authored
nodes:
  - id: sessions.harvest
    title: Harvest reviewed session evidence
    description: Extract and classify reusable units, triage one promotion, preserve branches, or assess automation readiness from reviewed evidence.
    kind: capability
    contract_level: navigation
    primary_parent: sessions
    owner: &session_owner
      repo: aoa-skills
      surface: capabilities/families/session-growth.yaml
      authority: authored
    lifecycle: &session_family_lifecycle
      state: candidate
      version: 0.1.0
      visibility: deferred
      evidence_state: manual-baseline
      health: challenger
    keywords:
      - session-evidence
      - harvest
      - candidate
      - classify
      - promote
      - branch
      - automation
      - сессия
      - свидетельство
      - кандидат
      - классификация
      - продвижение
      - ветка
      - автоматизация

  - id: skill.aoa-session-harvest
    title: aoa-session-harvest family bundle
    description: "Use only when a literal ref to a closed/reviewed session packet is supplied, to extract, classify, propose promotion or branching, or identify an automation opportunity. Missing, live, or unreviewed evidence must fail closed without inventing a ref. Natural closeout preservation belongs to aoa-memo-writeback. Do not use for generic summaries, progression, direct owner writes, scheduling, mutation, or telemetry authority."
    kind: skill
    contract_level: executable
    primary_parent: sessions.harvest
    owner: *session_owner
    lifecycle:
      state: candidate
      version: 0.2.4
      visibility: advertised
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - A literal supplied ref resolves to reviewed bounded evidence containing reusable units, an object or promotion decision, continuation branches, or a repeated manual route needing automation triage.
        - A request explicitly attempts to harvest or promote live or unreviewed session material and needs a bounded rejection before any mode procedure loads.
      do_not_use_when:
        - The request is generic summarization, progression scoring, memo writeback, repair, promotion execution, owner mutation, scheduling, or delegation.
      ambiguous_when:
        - Recurrence may be apparent only because several traces share the same temporary environment failure.
    abi:
      inputs:
        - name: reviewed-session-evidence
          type: reviewed-session-evidence
          required: true
          description: Reviewed evidence boundary, at least one literal supplied ref, and one extract, classify, promote, branch, or automation-opportunity intent.
      outputs:
        - name: reviewed-session-result
          type: reviewed-session-mode-result
          required: true
          description: One typed session-local packet with owner hint, rejected alternative, effect none, and stop line.
    binding:
      kind: skill
      ref: skills/core/session-growth/aoa-session-harvest/SKILL.md
      operation: route-one-mode
      availability: available
    execution: &harvest_execution
      freedom: bounded-judgment
      tool_requirements:
        - A literal supplied evidence ref and read access only to that exact reviewed packet and destination-owner intake contracts when supplied.
      verification:
        - Trace every candidate claim to reviewed refs and disposition stale or rejected hints.
        - Confirm no owner source, memory, routing, KAG, telemetry, or runtime state changed.
      termination:
        - Stop after one session-local packet, unresolved residue, and required owner review.
        - Stop as blocked when the evidence boundary or review posture is absent.
      effects:
        - none
      reversibility: not-applicable
      failure_modes:
        - Inferring or minting a packet or evidence ref that was not literally supplied.
        - Mining live transcripts or universalizing one success.
        - Minting authoritative IDs or writing owner artifacts directly from session evidence.
        - Treating promotion verdicts, progression scores, receipts, or telemetry as owner truth.
    trust: &session_trust
      public_safe: true
      requires_human_approval: false
      posture: authored-procedure
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-session-harvest/SKILL.md
          ref: capability-family-v0.2.4
          role: portable-family-procedure
          authority: authored
      optional_refs: []
    keywords:
      - reviewed-trace
      - extract-candidate
      - classify-artifact
      - promotion-verdict
      - route-branches
      - automation-opportunity
      - разобранная-трасса
      - извлечь-кандидата
      - классифицировать
      - варианты-продолжения

  - id: mode.session-harvest.extract
    title: Extract reusable candidate units
    description: Isolate repeatable units from reviewed evidence while preserving unresolved design pressure as non-candidate residue.
    kind: mode
    contract_level: executable
    primary_parent: sessions.harvest
    owner: *session_owner
    lifecycle: &session_mode_lifecycle
      state: candidate
      version: 0.1.0
      visibility: internal
      evidence_state: manual-baseline
      health: challenger
    applicability:
      use_when:
        - Reviewed evidence has not yet been decomposed into bounded reusable units and unresolved residue.
      do_not_use_when:
        - One candidate is already isolated and only destination classification or continuation branching remains.
      ambiguous_when:
        - A supplied hint may be stale, incidental, or an owner fact rather than a reusable procedure.
    abi:
      inputs:
        - name: reviewed-session-evidence
          type: reviewed-session-evidence
          required: true
          description: Reviewed boundary, trace refs, hints, and optional baseline or checkpoint.
      outputs:
        - name: harvest-packet
          type: harvest-packet
          required: true
          description: Reusable units, hint dispositions, evidence refs, owner shapes, rejected targets, unresolved residue, and typed handoffs.
    binding:
      kind: mode
      ref: skills/core/session-growth/aoa-session-harvest/references/extract.md
      operation: extract
      availability: available
    execution: *harvest_execution
    trust: *session_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-session-harvest/references/extract.md
          ref: capability-family-v0.2.0
          role: extract-mode
          authority: authored
      optional_refs: []
    aliases:
      - name: aoa-session-donor-harvest
        state: migration-only
        remove_after: session-harvest-runtime-parity
    keywords:
      - extract
      - recurring-unit
      - reviewed-evidence
      - residue
      - извлечь
      - повторяемая-единица
      - разобранное-свидетельство
      - остаток
      - разобранная-сессия
      - выделить

  - id: mode.session-harvest.classify
    title: Classify a reusable candidate
    description: Compare procedure, workflow, tool, guard, adapter, eval, memo, and no-artifact destinations without promoting anything.
    kind: mode
    contract_level: executable
    primary_parent: sessions.harvest
    owner: *session_owner
    lifecycle: *session_mode_lifecycle
    applicability:
      use_when:
        - One reviewed reusable unit is isolated and needs its next object kind and owner route.
      do_not_use_when:
        - Units have not been extracted or the destination owner is being asked to accept automatically.
      ambiguous_when:
        - Recurrence exists but independent composition value or a stable ABI has not been demonstrated.
    abi:
      inputs:
        - name: isolated-candidate
          type: isolated-session-candidate
          required: true
          description: One unit with evidence refs, recurrence, inputs/outputs, risk, reversibility, and proof posture.
        - name: harvest-packet
          type: harvest-packet
          required: false
          description: Optional upstream extraction set from which the isolated candidate was explicitly selected.
      outputs:
        - name: candidate-classification
          type: candidate-object-classification
          required: true
          description: Defer, reject, or propose destination with owner, rejected nearest kinds, and admission needs.
    binding:
      kind: mode
      ref: skills/core/session-growth/aoa-session-harvest/references/classify.md
      operation: classify
      availability: available
    execution: *harvest_execution
    trust: *session_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-session-harvest/references/classify.md
          ref: capability-family-v0.1.0
          role: classify-mode
          authority: authored
      optional_refs: []
    keywords:
      - classify
      - skill-or-workflow
      - tool-or-guard
      - eval-or-memo
      - no-artifact
      - классифицировать
      - скилл-или-workflow
      - инструмент
      - без-артефакта

  - id: mode.session-harvest.promote
    title: Triage one repeated quest-shaped unit
    description: Return a bounded promotion verdict for exactly one isolated reviewed repeated unit without authoring or accepting the destination artifact.
    kind: mode
    contract_level: executable
    primary_parent: sessions.harvest
    owner: *session_owner
    lifecycle: *session_mode_lifecycle
    applicability:
      use_when:
        - Exactly one reviewed repeated unit is isolated and only its quest, skill, playbook, agent, eval, memo, or hold verdict remains.
      do_not_use_when:
        - Evidence is live, recurrence is anecdotal, several donor units remain mixed, or the destination artifact is already clear and only authoring remains.
      ambiguous_when:
        - Repetition may be topic or conversation recurrence rather than repeated work or law.
    abi:
      inputs:
        - name: isolated-repeated-quest-unit
          type: isolated-repeated-quest-unit
          required: true
          description: One unit, reviewed repeat evidence posture, owner/risk boundaries, and residual promotion ambiguity.
      outputs:
