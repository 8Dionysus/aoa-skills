  - id: skill.aoa-checkpoint-closeout-bridge
    title: aoa-checkpoint-closeout-bridge transitional bundle
    description: "Carry provisional checkpoint hints into a reviewed session closeout: harvest, progression, quest-promotion, and branch handoff. Use to collect bounded hints or execute after the current session artifact is closed and reviewed. Do not use mid-session for final judgment, without reviewed evidence, as a hidden playbook runner, or to write owner truth."
    kind: skill
    contract_level: executable
    primary_parent: sessions.checkpoint-closeout
    owner: *session_owner
    lifecycle:
      state: candidate
      version: 0.2.4
      visibility: advertised
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - A live session needs a bounded provisional checkpoint focus packet without downstream verdicts.
        - One closed explicitly reviewed current-session artifact needs ordered harvest, progression, promotion, branch, and closeout reporting while aoa-playbooks has no executable MCP route.
      do_not_use_when:
        - The request is a generic recap, the evidence boundary is missing, or a live/unreviewed artifact is being used for final judgments.
        - The caller expects hidden playbook execution, owner acceptance, durable memory, quest mutation, progression mutation, routing, KAG, or stats writes.
      ambiguous_when:
        - A checkpoint packet appears complete but its judgments have not been corroborated by the primary reviewed artifact.
    abi:
      inputs:
        - name: checkpoint-closeout-request
          type: checkpoint-closeout-request
          required: true
          description: One collect or execute intent, current-session boundary, primary artifact, and optional provisional hints.
      outputs:
        - name: checkpoint-closeout-result
          type: checkpoint-closeout-result
          required: true
          description: One provisional focus packet, verified session-local execution report, or explicit blocked/unverified result.
    binding:
      kind: skill
      ref: skills/core/session-growth/aoa-checkpoint-closeout-bridge/SKILL.md
      operation: route-one-mode
      availability: available
    execution: &checkpoint_execution
      freedom: bounded-judgment
      tool_requirements:
        - Read access to the exact bundle procedures and current primary session artifact.
        - Exact available aoa-session-harvest and aoa-session-progression-lift bundles for execute nodes.
      verification:
        - Require closure, explicit review, and current-session identity before downstream execute loads.
        - Require serial owner-source gates and one observable procedure load plus primary-evidence reread per executed node.
        - Compare every report claim with observed actions and typed outputs; reject valid-plan-only execution claims.
      termination:
        - Stop after one provisional focus packet, one verified session-local closeout report, or the first explicit blocked/unverified state.
        - Stop before owner acceptance, playbook execution, delegation, durable memory, quest, progression, proof, routing, KAG, or stats mutation.
      effects: [none, generated-write]
      reversibility: reversible
      failure_modes:
        - Treating hints, a valid DAG, or final prose as execution evidence.
        - Loading downstream skills from live or unreviewed evidence.
        - Parallelizing dependency gates or DAG nodes and later citing their output IDs as serial execution.
        - Claiming the aoa-playbooks scenario was executed without its unavailable MCP owner.
    trust: *session_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-checkpoint-closeout-bridge/SKILL.md
          ref: capability-family-v0.2.4
          role: transitional-portable-procedure
          authority: authored
        - repo: aoa-playbooks
          path: playbooks/continuity/checkpoint/checkpoint-closeout-owner-route/PLAYBOOK.md
          ref: owner-route-current
          role: scenario-authority
          authority: external-authority
      optional_refs: []
    keywords:
      - checkpoint-closeout-bridge
      - collect-checkpoint-focus
      - execute-reviewed-closeout
      - serial-dag
      - переходный-bridge
      - закрытие-сессии

