  - id: skill.aoa-memo-writeback
    title: aoa-memo-writeback capability
    description: "Use only before any memo artifact exists to decide whether live-session, closeout, landed-work, PR, diff, or review evidence yields one guarded memo candidate, export, or no-write result. If a concrete memo candidate, export, object, corpus, lifecycle, or read-model target already exists, use aoa-memo. Do not use for eval mining, raw-session maintenance, generic harvest, recall, durable memory, or proof."
    kind: skill
    contract_level: executable
    primary_parent: sessions.memo-writeback
    owner: *session_owner
    lifecycle:
      state: candidate
      version: 0.2.10
      visibility: advertised
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - Live or closing work may contain a bounded durable owner lesson not yet represented by a concrete memo artifact.
        - The caller asks to assess or create the first guarded local candidate from inspectable evidence.
      do_not_use_when:
        - A concrete memo candidate, export, quarantine packet, memory object, corpus identity, or lifecycle target already exists.
        - Evaluation-trigger mining, session infrastructure maintenance, generic harvesting, proof/scoring, recall, owner intake review, or durable memo landing is needed.
      ambiguous_when:
        - The material may be progress or another owner's truth rather than a reusable memory lesson.
    abi:
      inputs:
        - name: memo-writeback-pressure
          type: memo-writeback-pressure
          required: true
          description: Likely owner, task/closeout context, inspectable session and source refs, port status, privacy, freshness, review, and effect posture.
      outputs:
        - name: memo-writeback-decision
          type: memo-writeback-decision
          required: true
          description: One decision plus bounded claim, owner route, packet or stop line, refs, proof limit, and next review.
    binding:
      kind: skill
      ref: skills/core/session-growth/aoa-memo-writeback/SKILL.md
      operation: decide-and-route
      availability: available
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Read access to inspectable session and owner-source evidence.
        - Owner-local write access only when an admitted memo port exists and candidate creation is authorized.
      verification:
        - Compare the bounded claim manually against source and session evidence, privacy posture, and the real owner boundary.
        - Inspect any candidate/export and run only existing owner-port validation.
      termination:
        - Stop after one write_candidate, prepare_export, no_writeback_needed, route_only_debt, needs_owner_review, blocked, or owner_handoff decision.
        - Stop before durable memory unless the explicit active route is aoa-memo reviewed corpus landing.
      effects:
        - repo-write
      reversibility: reversible
      failure_modes:
        - Promoting raw session history to memory truth or recapping an entire session.
        - Inventing a memo port, absorbing another owner's truth, or writing durable memory without review.
    trust: *session_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-memo-writeback/SKILL.md
          ref: capability-family-v0.2.10
          role: portable-procedure
          authority: authored
      optional_refs: []
    keywords:
      - memo-writeback-decision
      - write-candidate
      - prepare-export
      - no-writeback
      - route-only-debt
      - owner-handoff
      - memory-worthy
      - кандидат-мемо
