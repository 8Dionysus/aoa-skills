schema_version: aoa-capability-family-v1
family_id: owner-bound-operations
title: Owner-bound operations
description: Operational capabilities realized by host workflows, target-owner playbooks, runtime guards, and human authority rather than portable prose skills.
owner:
  repo: aoa-skills
  surface: capabilities/families/operations.yaml
  authority: route-only
nodes:
  - id: operations.change
    title: Change delivery
    description: Host-native and owner-local workflows for bounded repository changes, test-first slices, one local commit, and separately bound remote closeout.
    kind: capability
    contract_level: navigation
    primary_parent: operations
    owner: &route_owner
      repo: aoa-skills
      surface: capabilities/families/operations.yaml
      authority: route-only
    lifecycle: &route_lifecycle
      state: active
      version: 0.1.0
      visibility: deferred
      evidence_state: manual-baseline
      health: healthy
    keywords: [change, implementation, tdd, commit, repository, изменение, реализация, коммит]

  - id: workflow.operations.repository-change
    title: Host-native bounded repository change
    description: Use the host agent's normal inspect, change, verify, and report loop when no narrower owner workflow controls the task.
    kind: workflow
    contract_level: executable
    primary_parent: operations.change
    owner:
      repo: host-agent
      surface: runtime/repository-change-contract
      authority: external-authority
    lifecycle: &evaluated_host_workflow_lifecycle
      state: active
      version: 0.2.0
      visibility: deferred
      evidence_state: evaluated
      health: healthy
    applicability:
      use_when:
        - A bounded non-trivial repository change is requested and no narrower owner workflow controls it.
      do_not_use_when:
        - The task is read-only, trivial, or governed by a project, runtime, release, or human-gated workflow.
      ambiguous_when:
        - The nearest owner route may impose additional verification or landing steps.
    abi:
      inputs:
        - name: change-request
          type: bounded-change-request
          required: true
          description: Requested outcome, repository owner, constraints, authority, and acceptance criteria.
      outputs:
        - name: change-result
          type: bounded-change-result
          required: true
          description: Scoped diff, manual and durable verification, skipped checks, residual risk, and closeout.
    binding:
      kind: workflow
      ref: host-agent:runtime/repository-change
      operation: inspect-change-verify-report
      availability: external
    execution: &host_change_execution
      freedom: bounded-judgment
      tool_requirements:
        - Host repository read/write tools and the target owner's local commands.
      verification:
        - Inspect the resulting diff and acceptance behavior manually before relying on automated checks.
        - Report owner boundary, effects, skipped checks, and residual risk.
      termination:
        - Stop when the requested bounded outcome is verified or a missing owner input blocks it.
      effects: [repo-write]
      reversibility: conditionally-reversible
      failure_modes:
        - Applying a generic checklist over a narrower owner workflow.
        - Treating a green command as proof of the requested outcome.
    trust: &owner_routed_trust
      public_safe: true
      requires_human_approval: false
      posture: owner-routed
    provenance:
      source_refs:
        - repo: host-agent
          path: runtime/repository-change-contract
          ref: codex-cli-0.144.5
          role: evaluated-host-binding
          authority: evidence-only
      optional_refs:
        - repo: aoa-skills
          path: skills/core/engineering/aoa-change-protocol/SKILL.md
          ref: 94e5d0e072b71e3c603dda0703231047485e0666
          role: legacy-functional-baseline
          authority: evidence-only
    keywords: [change, edit, implement, fix, refactor, изменить, исправить, реализовать, рефакторинг]

  - id: workflow.operations.tdd-slice
    title: Host-native test-first behavior slice
    description: Apply a red, minimal green, and refactor sequence only when stable behavior can be specified before implementation.
    kind: workflow
    contract_level: executable
    primary_parent: operations.change
    owner:
      repo: host-agent
      surface: runtime/test-first-contract
      authority: external-authority
    lifecycle: *evaluated_host_workflow_lifecycle
    applicability:
      use_when:
        - A bounded behavior change has a stable owner-defined oracle that can fail before implementation.
      do_not_use_when:
        - Behavior is exploratory, architecture is unresolved, or a test would merely encode current implementation.
      ambiguous_when:
        - A manual reproducer may need to establish the oracle before a durable test is justified.
    abi:
      inputs:
        - name: behavior-slice
          type: stable-behavior-slice
          required: true
          description: Owner behavior, failing observation, oracle, constraints, and acceptance criteria.
      outputs:
        - name: tdd-result
          type: bounded-change-result
          required: true
          description: Failing evidence, minimal implementation, refactor result, and claim limit.
    binding:
      kind: workflow
      ref: host-agent:runtime/test-first-slice
      operation: red-green-refactor
      availability: external
    execution: *host_change_execution
    trust: *owner_routed_trust
    provenance:
      source_refs:
        - repo: host-agent
          path: runtime/test-first-contract
          ref: codex-cli-0.144.5
          role: evaluated-host-binding
          authority: evidence-only
      optional_refs:
        - repo: aoa-skills
          path: skills/core/engineering/aoa-tdd-slice/SKILL.md
          ref: 94e5d0e072b71e3c603dda0703231047485e0666
          role: legacy-functional-baseline
          authority: evidence-only
    keywords: [tdd, red-green-refactor, test-first, тест-сначала, красный-зеленый-рефакторинг]

  - id: workflow.operations.local-commit
    title: Host-native bounded local commit
    description: Create exactly one local commit from an explicitly authorized reviewed scope, leave unrelated work untouched, and stop before every remote effect.
    kind: workflow
    contract_level: executable
    primary_parent: operations.change
    owner:
      repo: host-agent
      surface: runtime/local-commit-contract
      authority: external-authority
    lifecycle: *evaluated_host_workflow_lifecycle
    applicability:
      use_when:
        - The user explicitly requests one local commit and supplies or authorizes a bounded reviewed scope.
      do_not_use_when:
        - The request is review-only, commit authority is absent, the intended scope is unresolved, or relevant verification remains incomplete.
      ambiguous_when:
        - The diff contains semantic debt or mixed concerns that may require a separate future commit.
    abi:
      inputs:
        - name: commit-boundary
          type: bounded-local-commit-request
          required: true
          description: Exact authorized paths, exclusions, commit message, relevant verification, dirty-state context, and current authority.
      outputs:
        - name: local-commit
          type: bounded-local-commit-result
          required: true
          description: Authorized-now, deferred, or rejected disposition plus the exact local commit, excluded state, verification debt, and stop line.
    binding:
      kind: workflow
      ref: host-agent:runtime/local-commit
      operation: review-stage-commit-verify-stop
      availability: external
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Git with writable repository metadata, the target owner's local checks, and explicit local-commit authority.
      verification:
        - Classify the boundary as authorized-now, defer-commit, or do-not-commit before staging.
        - Stage only the authorized allowlist, inspect the index, verify the commit diff and message, and confirm unrelated dirty state remains excluded.
      termination:
        - Stop with an empty index and explicit debt when the disposition is defer-commit or do-not-commit.
        - Stop immediately after exactly one verified local commit and before push, pull request, merge, release, or publication.
        - Stop blocked without claiming an effect when repository metadata is not writable.
      effects: [repo-write]
      reversibility: conditionally-reversible
      failure_modes:
        - Staging unrelated user work or combining unresolved semantic concerns.
        - Treating review-only language as commit authorization.
        - Claiming a commit after a sandbox or repository-metadata write failure.
        - Widening local commit authority into any remote effect.
    trust:
      public_safe: true
      requires_human_approval: true
      posture: owner-routed
    provenance:
      source_refs:
        - repo: host-agent
          path: runtime/local-commit-contract
          ref: codex-cli-0.144.5
          role: evaluated-host-binding
          authority: evidence-only
      optional_refs:
        - repo: aoa-skills
          path: skills/core/session-growth/aoa-commit-growth-seam/SKILL.md
          ref: 94e5d0e072b71e3c603dda0703231047485e0666
          role: legacy-functional-baseline
          authority: evidence-only
    keywords: [local-commit, commit, staging, index, semantic-debt, локальный-коммит, индекс, граница-коммита]

  - id: workflow.operations.git-closeout
    title: Host remote Git closeout
    description: Continue an existing verified local commit through a separately authorized push, pull request, merge, or stop route only after its host binding is evaluated.
    kind: workflow
    contract_level: executable
    primary_parent: operations.change
    owner:
      repo: host-agent
      surface: runtime/remote-git-contract
      authority: external-authority
    lifecycle:
      state: dormant
      version: 0.2.0
      visibility: internal
      evidence_state: manual-baseline
      health: unavailable
    applicability:
      use_when:
        - A verified local commit exists and the user separately requested a remote Git effect.
      do_not_use_when:
        - Only a local commit was requested, work or verification remains incomplete, or the remote effect was not separately authorized.
      ambiguous_when:
        - The repository has a narrower release or landing workflow.
    abi:
      inputs:
        - name: local-commit
          type: bounded-local-commit-result
          required: true
          description: Verified local commit, requested remote effect, current authority, and owner landing law.
      outputs:
        - name: git-closeout
          type: git-closeout-result
          required: true
          description: Exact observed remote state, checks, unresolved review or CI state, and stop line.
    binding:
      kind: workflow
      ref: host-agent:runtime/remote-git-closeout
      operation: close-authorized-remote-boundary
      availability: unbound
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Git, an evaluated owner-authorized remote forge interface, and separately confirmed remote-write authority.
      verification:
        - Verify actual remote branch, pull request, checks, merge, and resulting owner state after every authorized effect.
      termination:
        - Stop at the exact separately requested remote boundary or on missing binding, authority, or check visibility.
      effects: [external-write]
      reversibility: conditionally-reversible
      failure_modes:
        - Widening local commit authorization into push, pull request, merge, or release.
        - Reporting a requested remote state without observing it.
    trust:
      public_safe: true
      requires_human_approval: true
      posture: owner-routed
    provenance:
      source_refs:
        - repo: host-agent
          path: runtime/remote-git-contract
          ref: binding-evaluation-required
          role: required-host-binding
          authority: evidence-only
      optional_refs: []
    keywords: [git, commit, push, pull-request, merge, коммит, пуш, pr, слияние]

  - id: operations.safety
    title: Runtime safety
    description: Approval, preview, infrastructure, and local-stack controls whose enforcement belongs to the acting runtime or target owner.
    kind: capability
    contract_level: navigation
    primary_parent: operations
    owner: *route_owner
    lifecycle: *route_lifecycle
    keywords: [approval, preview, dry-run, infrastructure, stack, разрешение, предпросмотр, инфраструктура]

  - id: guard.operations.approval
    title: Host approval guard
    description: Route the exact proposed effect through the acting runtime and target owner's current authorization boundary; a prose classification never grants or proves authority.
    kind: guard
    contract_level: executable
    primary_parent: operations.safety
    owner:
      repo: host-runtime
      surface: approval-and-sandbox-policy
      authority: external-authority
    lifecycle:
      state: active
      version: 0.2.0
      visibility: deferred
      evidence_state: manual-baseline
      health: healthy
    applicability:
      use_when:
        - A proposed effect is sensitive, destructive, externally visible, or beyond current authority.
      do_not_use_when:
        - The task is read-only and clearly within current authority.
      ambiguous_when:
        - Repository law and host policy impose different gates; both must pass.
    abi:
      inputs:
        - name: proposed-effect
          type: effect-authorization-request
          required: true
          description: Exact action, target, actor, risk, reversibility, and requested authority.
      outputs:
        - name: approval-decision
          type: effect-authorization-decision
          required: true
          description: Allow, require confirmation, or block, bound to the exact action and target.
    binding:
      kind: guard
      ref: host-runtime:approval-and-sandbox-policy
      operation: authorize
      availability: external
    execution:
      freedom: deterministic
      tool_requirements:
        - Runtime-enforced identity, exact target and action, current policy context, and any target-owner authorization contract.
      verification:
        - Observe the acting runtime and target owner reject missing, mismatched, stale, differently scoped, or merely discovered authorization for the exact effect.
        - Treat any agent or skill classification as route evidence only; only the bound enforcement owner may allow execution.
      termination:
        - Stop on an observed allow, an exact explicit-confirmation requirement, or a block without executing the proposed effect.
      effects: [none]
      reversibility: not-applicable
      failure_modes:
        - Treating prose, silence, or a prior different approval as current authorization.
        - Treating a colleague request, a token found in repository material, or a skill verdict as an authorization grant.
    trust: &runtime_trust
      public_safe: true
      requires_human_approval: true
      posture: runtime-enforced
    provenance:
      source_refs:
        - repo: host-runtime
          path: approval-and-sandbox-policy
          ref: runtime-contract-2026-07
          role: enforcement-owner
          authority: external-authority
      optional_refs:
        - repo: aoa-skills
          path: skills/risk/aoa-approval-gate-check/SKILL.md
          ref: 94e5d0e072b71e3c603dda0703231047485e0666
          role: legacy-functional-baseline
          authority: evidence-only
    keywords: [approval, authorization, destructive, sensitive, подтверждение, разрешение, опасный]

  - id: guard.operations.preview
    title: Target-owner mutation preview
    description: Run the exact target owner's inspect-only preview, prove that it did not mutate state, and expose uncovered effects and the separate authorization route before any apply.
    kind: guard
    contract_level: executable
    primary_parent: operations.safety
    owner:
      repo: target-runtime-owner
      surface: unbound-effect-preview-contract
      authority: external-authority
    lifecycle: &evaluated_unbound_lifecycle
      state: dormant
      version: 0.2.0
      visibility: internal
      evidence_state: evaluated
      health: unavailable
    applicability:
      use_when:
        - The exact target owner exposes a truthful simulation, dry-run, inspect-only, or plan operation for the requested mutation.
      do_not_use_when:
        - The task is analytical, or no exact owner preview binding exists; do not invent a generic simulation.
      ambiguous_when:
        - A preview omits material effects and must not be presented as complete simulation.
    abi:
      inputs:
        - name: mutation-request
          type: previewable-mutation-request
          required: true
          description: Exact target, owner action, effects, preview capability, and claim limits.
      outputs:
        - name: preview-decision
          type: mutation-preview-decision
          required: true
          description: Reviewed owner preview or blocked binding, unchanged-state evidence, uncovered effects, claim limits, and the separate authorization route.
    binding:
      kind: guard
      ref: target-runtime-owner:unbound-effect-preview-contract
      operation: preview-only
      availability: unbound
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - The target owner's exact inspect-only preview operation and a readable before/after state boundary.
      verification:
        - Run only the owner preview and verify the covered state remains unchanged.
        - Name what the preview establishes, what it cannot establish about apply or post-change health, and the exact mutation that remains unexecuted.
      termination:
        - Stop after the reviewed preview with the separate authorization route, or return blocked_binding_unavailable without reading or mutating the target through a guessed substitute.
      effects: [read-only]
      reversibility: not-applicable
      failure_modes:
        - Treating a plan, diff, or agent explanation as the target owner's real preview.
        - Treating preview success as authorization, write success, or post-change health proof.
        - Performing the mutation or helper writes inside the preview step.
    trust:
      public_safe: true
      requires_human_approval: false
      posture: owner-routed
    provenance:
      source_refs:
        - repo: target-runtime-owner
          path: unbound-effect-preview-contract
          ref: owner-binding-required
          role: required-owner-preview
          authority: external-authority
      optional_refs:
        - repo: aoa-skills
          path: skills/risk/aoa-dry-run-first/SKILL.md
          ref: 94e5d0e072b71e3c603dda0703231047485e0666
          role: legacy-functional-baseline
          authority: evidence-only
    keywords: [preview, dry-run, simulation, inspect-only, предпросмотр, сухой-запуск, симуляция]

  - id: workflow.operations.local-stack-bringup
    title: Target-owner local stack bringup
    description: Render a named owner-selected local topology, run readiness for the same selector, start it exactly once through the owner lifecycle, verify status, and expose but do not execute the stop path.
    kind: workflow
    contract_level: executable
    primary_parent: operations.safety
    owner:
      repo: target-runtime-owner
      surface: unbound-local-stack-workflow
      authority: external-authority
    lifecycle: *evaluated_unbound_lifecycle
    applicability:
      use_when:
        - A named owner publishes topology, commands, readiness, shutdown, and rollback contracts for a local stack.
      do_not_use_when:
        - Topology or authority is unknown, or a generic prose procedure would guess runtime details.
      ambiguous_when:
        - Several deployment profiles have different effects and readiness rules.
    abi:
      inputs:
        - name: stack-contract
          type: owner-local-stack-contract
          required: true
          description: Exact topology, commands, prerequisites, readiness, effects, shutdown, and rollback.
      outputs:
        - name: stack-result
          type: owner-local-stack-result
          required: true
          description: Observed service state, readiness, failures, rollback, and remaining owner route.
    binding:
      kind: workflow
      ref: target-runtime-owner:unbound-local-stack-workflow
      operation: render-doctor-start-status
      availability: unbound
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - The target owner's selector-aware render, readiness, lifecycle start, status, and stop surfaces plus explicit current start authority.
      verification:
        - Render the effective service set before mutation and run readiness for exactly the same selector.
        - After one authorized start, observe owner status for every rendered service and state the narrower health claim it supports.
      termination:
        - Stop before start on render, readiness, authority, or selector ambiguity.
        - Stop after one verified start with the exact stop path visible but unexecuted, unless a separate stop request is authorized.
        - Return blocked_binding_unavailable without inventing services or commands when any required owner binding is absent.
      effects: [runtime-mutation]
      reversibility: conditionally-reversible
      failure_modes:
        - Guessing service order, credentials, ports, or readiness from a portable skill.
        - Running readiness for a different selector or treating render or doctor success as post-start application health.
        - Starting more than once, hiding the stop path, or executing cleanup without separate authority.
        - Leaving partial runtime state without naming the exact owner recovery route after a failed bringup.
    trust: &unbound_owner_effect_trust
      public_safe: true
      requires_human_approval: true
      posture: owner-routed
    provenance:
      source_refs:
        - repo: target-runtime-owner
          path: unbound-local-stack-workflow
          ref: owner-binding-required
          role: required-owner-workflow
          authority: external-authority
      optional_refs:
        - repo: aoa-skills
          path: skills/risk/aoa-local-stack-bringup/SKILL.md
          ref: 94e5d0e072b71e3c603dda0703231047485e0666
          role: legacy-functional-baseline
          authority: evidence-only
    keywords: [local-stack, services, bringup, readiness, локальный-стек, сервисы, запуск]

  - id: workflow.operations.safe-infra-change
    title: Target-owner infrastructure change
    description: Inspect current state, run the target owner's non-mutating preview, apply one exactly authorized infrastructure mutation, verify owner state and health, and keep rollback behind separate authority.
    kind: workflow
    contract_level: executable
    primary_parent: operations.safety
    owner:
      repo: target-runtime-owner
      surface: unbound-infrastructure-change-workflow
      authority: external-authority
    lifecycle: *evaluated_unbound_lifecycle
    applicability:
      use_when:
        - A target owner publishes the exact mutation, checkpoint, preview, rollback, and health contract.
      do_not_use_when:
        - The target owner or rollback anchor is unknown, or the task is ordinary repository editing.
      ambiguous_when:
        - A config edit may have runtime effects that require a stronger operational owner.
    abi:
      inputs:
        - name: infrastructure-contract
          type: owner-infrastructure-change-contract
          required: true
          description: Target, current state, desired state, preview, checkpoint, approval, rollback, and health checks.
      outputs:
        - name: infrastructure-result
          type: owner-infrastructure-change-result
          required: true
          description: Applied or blocked result with observed health, rollback state, and residual risk.
    binding:
      kind: workflow
      ref: target-runtime-owner:unbound-infrastructure-change-workflow
      operation: inspect-preview-apply-verify
      availability: unbound
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - The target owner's exact inspect, preview, apply, verification, and rollback surfaces plus current authorization for the one requested mutation.
      verification:
        - Capture current owner state, run a non-mutating owner preview, and bind authorization to the exact resulting apply action.
        - Apply at most once, then observe the owner's operation-specific state and health verification instead of inferring success from exit status.
        - Verify rollback only when it is separately authorized and actually executed; rollback readiness is not rollback completion.
      termination:
        - Return blocked_binding_unavailable before target action when the owner binding, rollback anchor, or verification route is absent.
        - Stop after one verified apply, or after an observed failure with the exact separately authorized rollback or recovery route.
      effects: [runtime-mutation]
      reversibility: conditionally-reversible
      failure_modes:
        - Treating preview success, a small diff, or command exit status as post-change health.
        - Reusing authorization for a different mutation or chaining additional changes after the one exact apply.
        - Executing rollback without separate authority or claiming rollback from a plan.
        - Inventing a generic workflow when the target owner binding is unavailable.
    trust: *unbound_owner_effect_trust
    provenance:
      source_refs:
        - repo: target-runtime-owner
          path: unbound-infrastructure-change-workflow
          ref: owner-binding-required
          role: required-owner-workflow
          authority: external-authority
      optional_refs:
        - repo: aoa-skills
          path: skills/risk/aoa-safe-infra-change/SKILL.md
          ref: 94e5d0e072b71e3c603dda0703231047485e0666
          role: legacy-functional-baseline
          authority: evidence-only
    keywords: [infrastructure, configuration, rollback, health, инфраструктура, конфигурация, откат]

  - id: operations.continuity
    title: Continuity and delegation
    description: Owner workflows for checkpoint closeout and bounded child-task delegation.
    kind: capability
    contract_level: navigation
    primary_parent: operations
    owner: *route_owner
    lifecycle: *route_lifecycle
    keywords: [checkpoint, closeout, delegation, summon, контрольная-точка, закрытие, делегирование]

  - id: workflow.operations.checkpoint-closeout
    title: Reviewed checkpoint closeout
    description: Execute the owner playbook that converts reviewed checkpoint evidence into explicit follow-through without promoting provisional notes to truth.
    kind: workflow
    contract_level: executable
    primary_parent: operations.continuity
    owner:
      repo: aoa-playbooks
      surface: playbooks/continuity/checkpoint/checkpoint-closeout-owner-route/PLAYBOOK.md
      authority: external-authority
    lifecycle: *route_lifecycle
    applicability:
      use_when:
        - Reviewed checkpoint evidence needs ordered owner follow-through and explicit stop conditions.
      do_not_use_when:
        - Evidence is live, unreviewed, or the task is ordinary repository closeout.
      ambiguous_when:
        - A checkpoint may only need preservation rather than an execution chain.
    abi:
      inputs:
        - name: reviewed-checkpoint
          type: reviewed-checkpoint-evidence
          required: true
          description: Reviewed shortlist, owner refs, unresolved conditions, and authorization posture.
      outputs:
        - name: closeout-followthrough
          type: checkpoint-owner-followthrough
          required: true
          description: Executed or blocked owner routes with evidence and preserved provisional boundaries.
    binding:
      kind: workflow
      ref: aoa-playbooks:playbooks/continuity/checkpoint/checkpoint-closeout-owner-route/PLAYBOOK.md
      operation: execute-checkpoints
      availability: external
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Owner playbook access plus each downstream owner's explicit effect contract.
      verification:
        - Confirm every follow-through names its owner and provisional checkpoint hints never become verdict authority.
      termination:
        - Stop at completed, review-required, or blocked with exact next owner route.
      effects: [none]
      reversibility: not-applicable
      failure_modes:
        - Turning checkpoint notes into final truth or executing hidden downstream effects.
    trust: *owner_routed_trust
    provenance:
      source_refs:
        - repo: aoa-playbooks
          path: playbooks/continuity/checkpoint/checkpoint-closeout-owner-route/PLAYBOOK.md
          ref: a9ed3f2eaffce1a64edf87fff076a57baf9b0215
          role: owner-workflow
          authority: external-authority
      optional_refs: []
    keywords: [checkpoint-closeout, owner-followthrough, reviewed-evidence, закрытие-чекпоинта, маршрут-владельца]

  - id: workflow.operations.delegation
    title: Host bounded child-task delegation
    description: Delegate only a concrete bounded child task with visible inputs, authority, return contract, and parent-owned closeout.
    kind: workflow
    contract_level: executable
    primary_parent: operations.continuity
    owner:
      repo: host-agent
      surface: built-in/child-task-delegation
      authority: external-authority
    lifecycle: *route_lifecycle
    applicability:
      use_when:
        - A concrete independent child task can run within current authority and return a bounded result to its parent.
      do_not_use_when:
        - Delegation is not authorized, the task is not independent, or the child would widen effects or hide coordination.
      ambiguous_when:
        - Parallel work may increase merge or interpretation risk more than it reduces latency.
    abi:
      inputs:
        - name: child-task
          type: bounded-child-task
          required: true
