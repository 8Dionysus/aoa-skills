  - id: tool.titan.approval-record
    title: Record a Titan approval witness
    description: Record an already explicit operator decision in SDK-visible console or bridge state without turning the record into approval authority.
    kind: tool
    contract_level: executable
    primary_parent: projects.titan.session.control
    owner:
      repo: aoa-sdk
      surface: mechanics/titan/parts/operator-console-helper-contracts/scripts/titan_console.py
      authority: external-authority
    lifecycle:
      state: active
      version: 0.1.0
      visibility: internal
      evidence_state: owner-verified
      health: healthy
    applicability:
      use_when: [An explicit operator decision must be preserved as a receipt-linked witness for one exact Titan gate.]
      do_not_use_when: [Approval is absent, inferred, reusable across actions, or the record would be treated as permission by itself.]
      ambiguous_when: [The decision text exists but actor, target, thread, turn, gate, or receipt identity is incomplete.]
    abi:
      inputs:
        - {name: operator-decision, type: explicit-operator-decision, required: true, description: "Actor, exact action, gate, target, thread, turn, receipt, decision, and source reference."}
      outputs:
        - {name: approval-witness, type: titan-approval-witness, required: true, description: "SDK-shaped witness record that carries no independent authorization."}
    binding: {kind: tool, ref: "aoa-sdk:mechanics/titan/parts/operator-console-helper-contracts/scripts/titan_console.py", operation: gate, availability: external}
    execution:
      freedom: deterministic
      tool_requirements: [Python and a current aoa-sdk checkout.]
      verification: [Match actor, action, gate, target, thread, turn, receipt, and source decision exactly; validate the resulting helper record.]
      termination: [Stop after one valid witness or fail closed on any missing identity; never activate a lane.]
      effects: [generated-write]
      reversibility: reversible
      failure_modes: [Inferring approval from silence or helper defaults., Reusing a witness for a different action or turn.]
    trust: {public_safe: true, requires_human_approval: false, posture: owner-routed}
    provenance:
      source_refs:
        - {repo: aoa-sdk, path: mechanics/titan/parts/operator-console-helper-contracts/CONTRACT.md, ref: be46faf0464ba6c56554e87bf72f30dc4fc512e7, role: helper-boundary, authority: external-authority}
        - {repo: aoa-sdk, path: mechanics/titan/parts/operator-console-helper-contracts/scripts/titan_console.py, ref: be46faf0464ba6c56554e87bf72f30dc4fc512e7, role: helper-tool, authority: external-authority}
      optional_refs: []
    keywords: [approval-record, operator-decision, Forge, Delta, разрешение, решение, оператор]
