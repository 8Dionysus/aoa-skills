      do_not_use_when: [The queue would decide operator intent, activate a role, or dispatch work.]
      ambiguous_when: [A decision exists outside the bridge but has not been bound to the exact request and turn.]
    abi:
      inputs:
        - {name: titan-bridge-state, type: titan-appserver-bridge-witness, required: true, description: "Normalized bridge state containing visible request and decision events with thread, turn, and receipt context."}
      outputs:
        - {name: approval-queue-state, type: titan-approval-queue-witness, required: true, description: "Pending, allowed, denied, or unresolved helper state with source refs."}
    binding: {kind: tool, ref: "aoa-sdk:src/aoa_sdk/titans/appserver_bridge.py", operation: ingest-and-decide-approval, availability: external}
    execution:
      freedom: deterministic
      tool_requirements: [Python and visible app-server event input.]
      verification: [Validate the bridge state and preserve unresolved or mismatched requests as blocked rather than approved.]
      termination: [Stop after one bounded queue readout; do not start or steer a turn.]
      effects: [generated-write]
      reversibility: reversible
      failure_modes: [Treating queue status as operator authority., Resolving a request without exact thread-turn identity.]
    trust: {public_safe: true, requires_human_approval: false, posture: owner-routed}
    provenance:
      source_refs:
        - {repo: aoa-sdk, path: src/aoa_sdk/titans/appserver_bridge.py, ref: be46faf0464ba6c56554e87bf72f30dc4fc512e7, role: helper-implementation, authority: external-authority}
