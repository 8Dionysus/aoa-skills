  - id: skill.aoa-knowledge-stewardship
    title: aoa-knowledge-stewardship family bundle
    description: Sanitize private technical material into a public-safe owner-bounded derivative, or resolve authority among authored, generated, runtime, and installed sources. Use when incidents, logs, configs, diagnostics, credentials, private paths, host/network topology, or conflicting sources require a named-audience review draft or authority map. Preserve raw custody and separate artifact creation from publication. Do not use for memo writeback, session mining, direct publication execution, durable-memory authority, or ordinary prose editing.
    kind: skill
    contract_level: executable
    primary_parent: stewardship.knowledge
    owner: *steward_owner
    lifecycle:
      state: candidate
      version: 0.2.7
      visibility: advertised
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - Source roles conflict or an explicit audience or disclosure class needs a sanitized derivative at an exact governed destination.
      do_not_use_when:
        - The task is memo writeback, the material is already suitable for its destination without transformation, or the request is direct publication, durable-memory authority, ordinary prose editing, or a private local typo or helper edit.
      ambiguous_when:
        - The task may concern decision rationale rather than current source authority; route decision work separately.
    abi:
      inputs:
        - name: stewardship-request
          type: knowledge-stewardship-request
          required: true
          description: One intent plus exact source, sensitivity-policy and destination-contract refs, audience or disclosure class, destination, review requirement, effect authority, and any owner-specific claim.
      outputs:
        - name: stewardship-result
          type: knowledge-stewardship-result
          required: true
          description: One mode result with owner, route or transformation, validation, residual risk, claim limit, and stop line.
    binding:
      kind: skill
      ref: skills/core/stewardship/aoa-knowledge-stewardship/SKILL.md
      operation: route-one-mode
      availability: available
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Read access to exact target-specific effect, sensitivity, and destination declarations.
        - Destination write access only when explicit effect authority covers the exact derivative path.
      verification:
        - Confirm exactly one mode, source refs, audience or disclosure class, destination, effect authority, and any unresolved owner edge.
        - Inspect the mapping, transformed artifact, or handoff packet manually and state residual risk.
      termination:
        - Stop after one bounded result and remaining owner review.
        - Stop before target reads when a required governing ref or direct-publication owner workflow is missing.
      effects:
        - none
        - generated-write
      reversibility: conditionally-reversible
      failure_modes:
        - Moving authority, raw custody, or privacy policy into a generic skill.
        - Treating a generated, newest, or easiest-to-find source as authoritative without owner law.
        - Reading private target material before the exact destination contract is supplied and validated.
        - Preparing a derivative during a blocked direct-publication request.
    trust: &steward_trust
      public_safe: true
      requires_human_approval: false
      posture: authored-procedure
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/stewardship/aoa-knowledge-stewardship/SKILL.md
          ref: capability-family-v0.2.7
          role: portable-family-procedure
          authority: authored
      optional_refs: []
    keywords:
      - authority-map
      - sanitized-share
      - owner-truth
      - карта-источников
      - безопасная-публикация

  - id: mode.knowledge.authority-map
    title: Map source authority
    description: Classify authored, generated, cached, runtime, and entrypoint surfaces and resolve conflicts from owner law.
    kind: mode
    contract_level: executable
    primary_parent: stewardship.knowledge
    owner: *steward_owner
    lifecycle:
      state: candidate
      version: 0.2.6
      visibility: internal
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - Authored, generated, cached, runtime, or entrypoint sources overlap, disagree, or confuse consumers.
      do_not_use_when:
        - Existing decision rationale or supersession is the question rather than current source authority.
      ambiguous_when:
        - Fresh runtime state and authored policy both matter but answer different questions.
    abi:
      inputs:
        - name: authority-conflict
          type: source-authority-conflict
          required: true
          description: Candidate surfaces, owner declarations, consumers, and the concrete conflict or ambiguity.
      outputs:
        - name: authority-map
          type: source-authority-map
          required: true
          description: Canonical homes, source roles, derived consumers, conflicts, and unresolved owner edge.
    binding:
      kind: mode
      ref: skills/core/stewardship/aoa-knowledge-stewardship/references/authority-map.md
      operation: authority-map
      availability: available
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Read access to exact target surfaces and target-specific owner role declarations.
      verification:
        - Confirm source roles, canonical owner surface, derived consumers, conflict, and unresolved owner edges.
        - State which source remains authoritative and what no-write or owner handoff follows.
      termination:
        - Stop after one authority map and explicit unresolved owner edges.
        - Stop as blocked when target-specific owner law is unavailable.
      effects:
        - none
      reversibility: not-applicable
      failure_modes:
        - Choosing authority by freshness, prominence, generated timestamp, or proximity.
        - Inventing a missing owner, source ref, rebuild owner, or consumer input.
    trust: *steward_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/stewardship/aoa-knowledge-stewardship/references/authority-map.md
          ref: capability-family-v0.2.6
          role: authority-map-mode
          authority: authored
      optional_refs: []
    aliases:
      - name: aoa-source-of-truth-check
        state: migration-only
        remove_after: knowledge-stewardship-runtime-parity
    keywords:
      - source-of-truth
      - canonical-home
      - authored-derived
      - conflict
      - источник-истины
      - канонический
      - авторский
      - производный
      - конфликт
      - файл
      - generated-view

  - id: mode.knowledge.sanitized-share
    title: Prepare a sanitized technical derivative
    description: Preserve a technical lesson for an explicit audience or disclosure class while removing unnecessary private identifiers and keeping publication separate.
    kind: mode
    contract_level: executable
    primary_parent: stewardship.knowledge
    owner: *steward_owner
    lifecycle:
      state: candidate
      version: 0.2.7
      visibility: internal
      evidence_state: evaluated
      health: challenger
    applicability:
      use_when:
        - Private technical material must become useful for an explicit audience or disclosure class and destination threshold.
      do_not_use_when:
        - No audience or disclosure class or disclosure threshold exists, direct publication is requested without its owner workflow, or private credentials are requested for a public destination.
      ambiguous_when:
        - Removing a private detail may also remove the technical mechanism needed by the audience.
    abi:
      inputs:
        - name: private-material
          type: private-technical-material
          required: true
          description: Bounded raw material, audience or disclosure class, exact destination threshold, sensitivity rules, raw-preservation boundary, effect authority, and any owner-specific claim.
      outputs:
        - name: sanitized-derivative
          type: sanitized-technical-derivative
          required: true
          description: Useful reviewed derivative or no-write decision with residual privacy uncertainty.
    binding:
      kind: mode
      ref: skills/core/stewardship/aoa-knowledge-stewardship/references/sanitized-share.md
      operation: sanitized-share
      availability: available
    execution:
      freedom: bounded-judgment
      tool_requirements:
        - Read access to the exact supplied effect, sensitivity, and destination declarations before raw material.
        - Destination write access only when explicitly authorized for the exact derivative path.
      verification:
        - Inspect usefulness and registered private patterns manually without changing raw custody.
        - Distinguish derivative creation, publication, and durable write authorities.
      termination:
        - Stop after a reviewed derivative or explicit no-write decision and residual-risk report.
        - Stop before target reads when the destination contract is not supplied.
        - Stop before target reads when direct publication lacks its exact owner workflow and authority.
      effects:
        - none
        - generated-write
      reversibility: conditionally-reversible
      failure_modes:
        - Removing so much context that the lesson becomes misleading.
        - Publishing merely because the derivative appears public-safe.
        - Substituting raw custody, response transport, the skill owner, or a nearby owner for a destination owner required by an owner-specific claim.
        - Reading raw or preparing a derivative after a missing-input or publication-workflow block.
    trust: *steward_trust
    provenance:
      source_refs:
        - repo: aoa-skills
          path: skills/core/stewardship/aoa-knowledge-stewardship/references/sanitized-share.md
          ref: capability-family-v0.2.7
          role: sanitized-share-mode
          authority: authored
      optional_refs: []
    aliases:
      - name: aoa-sanitized-share
        state: migration-only
        remove_after: knowledge-stewardship-runtime-parity
    keywords:
      - sanitize
      - redact
      - public-safe
      - private-path
      - credential
      - обезличить
      - очистить
      - приватность
      - публикация
      - обезличенная-выжимка
      - технический-отчет
      - публичный

