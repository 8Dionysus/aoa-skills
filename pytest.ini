[pytest]
markers =
    source: deterministic source, schema, route-law, and authored-surface contract tests.
    generated: generated/read-model parity and drift tests.
    export: portable export, runtime, support-resource, and packaging tests.
    router: trigger, description, tiny-router, and golden route tests.
    release: CI, release lane, and command-authority tests.
    advisory: review/audit tests that are evidence surfaces before they become gates.
    live: tests that may depend on sibling or operator-local state.
    slow: tests with subprocess, full-repo copy, or multi-second runtime cost.
