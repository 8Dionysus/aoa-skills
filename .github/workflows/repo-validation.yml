name: Repo Validation

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: repo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  growth_gate:
    name: Repo Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aoa-skills
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Check repo-local KAG index family
        uses: 8Dionysus/aoa-kag/.github/actions/repo-local-kag-index@cc0ba190c932921f1e23dff4536229f359275f8a
        with:
          history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          event-history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run source-fast growth gate
        run: python scripts/lanes/ci_gate.py --mode source-fast

      - name: Run main integration generated gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/lanes/ci_gate.py --mode generated --group all
