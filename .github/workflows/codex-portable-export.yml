name: codex-portable-export

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: codex-portable-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run growth-safe export sentinel
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_gate.py --mode export --changed-only --base-ref "$BASE_REF"

      - name: Run full export lane
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/ci_gate.py --mode export
