name: Release Audit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_audit:
    name: Release Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aoa-skills
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: workspace/aoa-skills
          fetch-depth: 0

      - name: Checkout abyss-machine verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 8Dionysus/abyss-machine
          ref: 52252e4ef7d98361d99e29056e98fcba403a2d6d
          path: workspace/abyss-machine
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: workspace/aoa-skills
        run: python -m pip install -r requirements-dev.txt

      - name: Run release freeze gate
        working-directory: workspace/aoa-skills
        env:
          ABYSS_MACHINE_REPO_ROOT: ${{ github.workspace }}/workspace/abyss-machine
        run: python scripts/lanes/ci_gate.py --mode release
