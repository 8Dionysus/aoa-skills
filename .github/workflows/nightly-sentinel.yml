name: Nightly Sentinel

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main_growth:
    name: Main Growth Sentinel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run moving-main growth sentinel
        run: |
          python scripts/lanes/ci_gate.py --mode nightly | tee nightly-main-report.txt
          {
            echo "## Main growth sentinel"
            echo
            echo '```'
            cat nightly-main-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  latest_release_repro:
    name: Latest Release Repro
    runs-on: ubuntu-latest
    env:
      ABYSS_MACHINE_VERIFIER_REF: 4f8993d525991ac1803a11685f70814c7c378e39
    steps:
      - name: Checkout repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Resolve latest release tag
        id: latest
        run: |
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No v* release tag found" >&2
            exit 1
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: $latest_tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout latest release tag
        run: git checkout --detach "${{ steps.latest.outputs.tag }}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Prepare abyss-machine verifier
        run: |
          git clone https://github.com/8Dionysus/abyss-machine.git "$RUNNER_TEMP/abyss-machine"
          git -C "$RUNNER_TEMP/abyss-machine" checkout "$ABYSS_MACHINE_VERIFIER_REF"

      - name: Reproduce latest release gate
        env:
          ABYSS_MACHINE_REPO_ROOT: ${{ runner.temp }}/abyss-machine
        run: python scripts/release_check.py
